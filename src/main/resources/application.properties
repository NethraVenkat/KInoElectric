# ==========================================================
#  PadaShakti - Smart Kinetic Floor Energy Harvesting Network
#  Common configuration (all profiles)
# ==========================================================
spring.application.name=javaleap
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
server.port=${SERVER_PORT:8080}

# ---------- JPA / Hibernate ----------
# Flyway owns the schema; Hibernate only validates it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# ---------- Flyway ----------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true

# ---------- Actuator ----------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.info.env.enabled=true
info.app.name=PadaShakti
info.app.description=Smart Urban Subway Kinetic Floor Energy Harvesting Network
info.app.version=1.0.0

# ---------- Swagger / OpenAPI ----------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# ==========================================================
#  Application settings (bound to AppProperties.java)
# ==========================================================
# CORS - React dev server
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# JWT (used from Step 4) - secret must be Base64, 256-bit or longer
app.jwt.secret=${JWT_SECRET:UGFkYVNoYWt0aUtpbmV0aWNGbG9vckVuZXJneUhhcnZlc3RpbmdTZWNyZXRLZXkyMDI2IQ==}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Energy & impact formulas
app.energy.min-joules-per-step=2.0
app.energy.max-joules-per-step=5.0
app.energy.tariff-per-kwh=8.0
app.energy.co2-kg-per-kwh=0.71

# Simulation engine (used from Step 5)
app.simulation.enabled=true
app.simulation.tick-ms=1500

# Kinetic network (Phase B)
app.kinetic.battery-charge-efficiency=0.95
app.kinetic.export-threshold-pct=80
app.kinetic.overcrowding-density-pct=85
app.kinetic.degraded-health-pct=40
app.kinetic.reading-retention-hours=24
app.kinetic.telemetry-retention-days=90

# Organisation issuing invoices (GST: same state code -> CGST+SGST, else IGST). Fictional GSTIN.
app.company.name=PadaShakti Transit Energy Network
app.company.gstin=33AAATP4321K1Z7
app.company.state-code=33
app.company.state=Tamil Nadu
app.company.address=Chennai Central Metro, Chennai 600003
